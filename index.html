    <script>
      (function() {
        try {
          var saved = localStorage.getItem('abc_stationery_v1_dark') || localStorage.getItem('theme');
          var dark = saved === 'true' || saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
